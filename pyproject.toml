[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
version = "0.3.0"
description = "Atlas structural identity analysis research framework"
readme = "README.md"
requires-python = ">=3.14"
authors = [
    { name = "Michael Elvis Brockway" }
]
dependencies = [
    "numpy",
    "pandas",
    "networkx",
    "streamlit",
    "plotly",
    "pyarrow",
    "jsonschema",
    "watchdog",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"